name: Publish Docker image
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dobby-image-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      deployments: write
    environment:
      name: github-packages
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bot image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pinned so a new final stage can never publish a test image.
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summarize package deployment
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo '## Published bot package'
            echo
            echo "Built from tested commit: \`$REVISION\`"
            echo
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Rolling tags: \`$IMAGE:main\`, \`$IMAGE:latest\`"
            echo "- Commit tag: \`$IMAGE:sha-$REVISION\`"
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo
            echo 'Pull with:'
            echo '```sh'
            echo "docker pull $IMAGE:main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
