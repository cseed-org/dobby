name: Publish Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dobby-image-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches the Docker image
      - run: pip install -r requirements.txt
      - run: python scripts/check_secrets.py
      - run: ruff check bot scripts tests
      - run: ruff format --check bot scripts tests
      - run: python -m pytest -q
      # compose.yaml marks credentials as required (:?); placeholders let the file validate.
      - run: docker compose --env-file .env.example config --quiet
        env:
          DISCORD_TOKEN: placeholder
          DISCORD_GUILD_ID: "1"
          GEMINI_API_KEY: placeholder
          COMPOSIO_API_KEY: placeholder
          POSTGRES_PASSWORD: placeholder
          SECRET_KEY: placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          DISCORD_CLIENT_ID: placeholder
          DISCORD_CLIENT_SECRET: placeholder
          BOOTSTRAP_ADMIN_EMAIL: admin@uw.edu
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pinned so a new final stage can never publish a test image.
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
