name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: System regression tests
    uses: ./.github/workflows/regression.yml
  test:
    runs-on: ubuntu-latest
    services:
      # Scratch postgres for tests/integration (mirrors compose.test.yaml postgres-test).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dobby
          POSTGRES_PASSWORD: dobby
          POSTGRES_DB: dobby_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U dobby -d dobby_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches the Docker image
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_secrets.py
      - run: ruff check bot scripts tests dashboard/tests
      - run: ruff format --check bot scripts tests dashboard/tests
      # Offline unit suites (bot + dashboard), then the postgres-backed suite.
      - run: python -m pytest -q
      - run: python -m pytest dashboard/tests -q
      - run: python -m pytest tests/integration -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://dobby:dobby@127.0.0.1:5433/dobby_test
      # compose.yaml marks credentials as required (:?); placeholders let the file validate.
      - run: docker compose --env-file .env.example config --quiet
        env:
          DISCORD_TOKEN: placeholder
          DISCORD_GUILD_ID: "1"
          AI_API_KEY: placeholder
          COMPOSIO_API_KEY: placeholder
          POSTGRES_PASSWORD: placeholder
          SECRET_KEY: placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          DISCORD_CLIENT_ID: placeholder
          DISCORD_CLIENT_SECRET: placeholder
          BOOTSTRAP_ADMIN_EMAIL: admin@uw.edu
      - run: docker compose -f compose.test.yaml config --quiet
      - run: docker build -t calendar-bot:test .
      - run: docker run --rm --entrypoint python calendar-bot:test -c "import bot.main; import google.genai"
      # The same suite the developer runs locally, in the image it ships in (python 3.12).
      - run: docker compose -f compose.test.yaml run --rm tests
      - run: docker compose -f compose.test.yaml run --rm lint
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, regression]
    permissions:
      contents: read
      packages: write
      deployments: write
    uses: ./.github/workflows/publish.yml
